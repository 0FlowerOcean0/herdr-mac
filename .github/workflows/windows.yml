name: Windows Preview

on:
  push:
    branches:
      - main
      - windows-client
    tags:
      - "windows-v*"
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/terminal-web/package-lock.json

      - name: Build and package Windows preview
        shell: pwsh
        run: ./windows/package-windows.ps1

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: Herdr-for-Windows-0.1.0-preview.2-x64
          path: |
            artifacts/Herdr-for-Windows-0.1.0-preview.2-x64-Setup.exe
            artifacts/Herdr-for-Windows-0.1.0-preview.2-x64-Setup.exe.sha256
            artifacts/Herdr-for-Windows-0.1.0-preview.2-x64.zip
            artifacts/Herdr-for-Windows-0.1.0-preview.2-x64.zip.sha256
          if-no-files-found: error

      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create $env:GITHUB_REF_NAME
          artifacts/Herdr-for-Windows-0.1.0-preview.2-x64-Setup.exe
          artifacts/Herdr-for-Windows-0.1.0-preview.2-x64-Setup.exe.sha256
          artifacts/Herdr-for-Windows-0.1.0-preview.2-x64.zip
          artifacts/Herdr-for-Windows-0.1.0-preview.2-x64.zip.sha256
          --title "Herdr for Windows 0.1.0 Preview 2"
          --notes "Unofficial native WinUI 3 client for the official Herdr Windows Preview. Requires a separately installed herdr.exe."
          --prerelease
